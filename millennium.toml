[plugin]
id = "com.gaboron.satli-lite"
name = "SATLI lite"
version = "0.1.0"
author = "GaBoron"
description = "在 Steam 库存中下载、预览和应用社区成就翻译。"

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[webkit]
entry = "webview/preload.ts"

[compiler]
output_path = "dist/satli-lite.star"

[dev]
auto_restart = true
reload_steamui_when = "both"

[logger]
padding = 0
backend_prefix = "SATLI-lite"
frontend_prefix = "SATLI-lite"
webview_prefix = "SATLI-lite-web"
